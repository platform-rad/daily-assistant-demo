<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Assistant - Credit Memo Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7aa8da 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { color: #1e293b; margin-bottom: 20px; }
    p { color: #64748b; line-height: 1.6; margin-bottom: 30px; }
    .button-group { display: flex; gap: 12px; flex-direction: column; }
    button { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #7D4FFE; color: white; }
    .btn-primary:hover { background: #6D3BF0; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .feature-list { text-align: left; margin: 30px 0; background: #f8fafc; padding: 20px; border-radius: 8px; }
    .feature-list li { list-style: none; padding: 8px 0; }
    .feature-list li:before { content: "✓ "; color: #10b981; margin-right: 8px; }
    code { background: #1e293b; color: #10b981; padding: 8px; border-radius: 4px; font-family: monospace; display: block; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Daily Assistant</h1>
    <p>Credit Memo creation + Meena meeting notes</p>
    
    <ul class="feature-list">
      <li>Split-screen editor with AI chat</li>
      <li>Meeting notes with voice</li>
      <li>Desktop environment</li>
    </ul>

    <div class="button-group">
      <button class="btn-primary" onclick="alert('Exécute dans Terminal:\nnpm install --legacy-peer-deps\nnpm run dev\n\nPuis ouvre http://localhost:5174')">▶️ Lancer localement</button>
      <button class="btn-secondary" onclick="window.open('https://github.com/platform-rad/daily-assistant-demo', '_blank')">📂 GitHub</button>
    </div>

    <code>npm install --legacy-peer-deps && npm run dev</code>
  </div>
</body>
</html>
